packages:
  - "frontend/*"
  - "backend/*"
  - "packages/*"
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
overrides:
  postcss: ">=8.5.18"
  sharp: ">=0.35.0"
  fast-uri: "3.1.5"
  brace-expansion@^1.1.7: "1.1.18"
  brace-expansion@^2.0.1: "2.1.4"
  brace-expansion@^5.0.0: "5.0.9"
  js-yaml@^3.13.1: "3.15.1"
  js-yaml@^4.0.0: "4.3.1"
  nanoid@^3.3.8: "3.3.17"
