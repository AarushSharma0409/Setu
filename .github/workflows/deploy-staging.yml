name: Deploy staging

on:
  workflow_run:
    workflows: [Container images]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable commit SHA image tag to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: setu-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: staging
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
    steps:
      - name: Validate immutable image tag
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
      - name: Configure SSH host verification
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '${{ secrets.DEPLOY_KNOWN_HOSTS }}' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy immutable image over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_PORT:?Missing DEPLOY_PORT}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH}"
          : "${GHCR_PULL_USERNAME:?Missing GHCR_PULL_USERNAME}"
          : "${GHCR_PULL_TOKEN:?Missing GHCR_PULL_TOKEN}"
          printf '%s' "$GHCR_PULL_TOKEN" | ssh -p "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io --username '$GHCR_PULL_USERNAME' --password-stdin && SETU_DEPLOY_ROOT='$DEPLOY_PATH' '$DEPLOY_PATH/scripts/deploy.sh' '$IMAGE_TAG'"
